<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Microschool</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >
</head>

<body>

<header class="topbar">
    <div class="brand">
        Microschool
    </div>

    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#learners">Learners</a>
        <a href="#courses">Courses</a>
        <a href="#pods">Pods</a>
    </nav>
</header>


<main>

<section id="dashboard" class="hero">

    <div>
        <p class="eyebrow">
            PERSONAL LEARNING PLATFORM
        </p>

        <h1>
            Learn at your own pace.
        </h1>

        <p>
            A small learning environment for
            learners, guides, and families.
        </p>
    </div>

</section>


<section class="dashboard-grid">

    <article class="card">
        <h2>Learners</h2>
        <div id="learner-count">Loading...</div>
    </article>

    <article class="card">
        <h2>Pods</h2>
        <div id="pod-count">Loading...</div>
    </article>

    <article class="card">
        <h2>Courses</h2>
        <div id="course-count">Loading...</div>
    </article>

</section>


<section id="learners" class="section">

    <h2>Learners</h2>

    <div id="learners-list">
        Loading...
    </div>

</section>


<section id="courses" class="section">

    <h2>Courses</h2>

    <div id="courses-list">
        Loading...
    </div>

</section>

</main>


<script src="/app.js"></script>

</body>
</html>
